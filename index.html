<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>宠物小学</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
    </style>
    <style>
      :root{
        --ink:#3d3229;
        --ink-soft:#7a6a58;
        --paper:#fffdf7;
        --coral:#ff5a4e;
        --coral-dark:#e8453a;
        --sun:#ffb52e;
        --leaf:#57b96a;
        --sky:#5aa9e6;
        --pink:#ff9fb2;
        --card:#ffffff;
        --line:#f0e4d3;
        --shadow:0 10px 30px rgba(93,64,28,.12);
        --radius:20px;
      }
      *{ box-sizing:border-box; }
      html,body{ margin:0; padding:0; overflow-x:clip; }
      body{
        font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
        background:
          radial-gradient(1100px 500px at 85% -120px, #ffe9b8 0%, rgba(255,233,184,0) 60%),
          radial-gradient(900px 480px at -10% 0%, #d8f3dc 0%, rgba(216,243,220,0) 55%),
          #fdf8ec;
        color:var(--ink);
        -webkit-font-smoothing:antialiased;
      }
      .display{ font-family:"ZCOOL KuaiLe","PingFang SC",sans-serif; letter-spacing:.02em; }
      button{ font-family:inherit; cursor:pointer; }
      img,svg{ display:block; }

      /* ---------- 入学大门 ---------- */
      #entry{
        min-height:100svh; display:flex; align-items:center; justify-content:center;
        padding:28px 16px 48px;
      }
      .entry-wrap{ width:100%; max-width:880px; }
      .gate{ text-align:center; margin-bottom:6px; }
      .gate svg{ margin:0 auto; width:min(560px,92vw); height:auto; }
      .gate h1{
        font-family:"ZCOOL KuaiLe",sans-serif; font-size:clamp(2.4rem,7vw,3.6rem);
        margin:.1em 0 .05em; color:var(--ink);
      }
      .gate h1 .accent{ color:var(--coral); }
      .gate p{ margin:0; color:var(--ink-soft); font-size:1rem; }
      .gate .live-line{
        display:inline-flex; align-items:center; gap:8px; margin-top:14px;
        background:#fff; border:1.5px solid var(--line); border-radius:999px;
        padding:7px 16px; font-size:.92rem; box-shadow:var(--shadow);
      }
      .dot{ width:9px; height:9px; border-radius:50%; background:#3ecf6e; box-shadow:0 0 0 0 rgba(62,207,110,.5); animation:pulse 1.8s infinite; }
      @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(62,207,110,.45)} 70%{box-shadow:0 0 0 9px rgba(62,207,110,0)} 100%{box-shadow:0 0 0 0 rgba(62,207,110,0)} }

      .enroll{
        margin:26px auto 0; background:var(--card); border-radius:26px; box-shadow:var(--shadow);
        border:1.5px solid var(--line); padding:24px; display:grid; gap:22px;
        grid-template-columns:220px minmax(0,1fr); max-width:820px; width:100%;
      }
      .preview-box,.form-side{ min-width:0; }
      .preview-box{
        background:linear-gradient(180deg,#cfeeff 0%,#eafbe7 78%,#b9e7a8 78%,#a5dd8f 100%);
        border-radius:18px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
        padding:18px 10px 14px; min-height:230px; position:relative; overflow:hidden;
      }
      .preview-box .sun{ position:absolute; top:12px; right:14px; width:34px; height:34px; border-radius:50%; background:#ffd94d; box-shadow:0 0 0 7px rgba(255,217,77,.35); }
      .preview-box .cloud{ position:absolute; background:#fff; border-radius:999px; opacity:.9; }
      .preview-box .c1{ width:64px; height:20px; top:22px; left:16px; }
      .preview-box .c2{ width:44px; height:15px; top:44px; left:44px; }
      #previewPet{ width:150px; height:auto; position:relative; z-index:2; animation:bob 2.6s ease-in-out infinite; }
      @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
      .preview-name{ margin-top:8px; font-family:"ZCOOL KuaiLe",sans-serif; font-size:1.15rem; background:#fff; padding:3px 14px; border-radius:999px; box-shadow:0 3px 8px rgba(0,0,0,.08); position:relative; z-index:2; }
      .form-side{ display:flex; flex-direction:column; gap:18px; }
      .field-label{ font-family:"ZCOOL KuaiLe",sans-serif; font-size:1.05rem; margin-bottom:9px; display:flex; align-items:center; gap:8px; }
      .field-label .step{
        width:22px; height:22px; border-radius:50%; background:var(--coral); color:#fff;
        display:inline-flex; align-items:center; justify-content:center; font-size:.85rem; font-family:inherit;
      }
      .species-row{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; }
      .species-btn{
        border:2.5px solid var(--line); background:#fffaf1; border-radius:16px; padding:12px 8px 9px;
        display:flex; flex-direction:column; align-items:center; gap:2px; font-size:1rem; color:var(--ink);
        transition:border-color .15s, background .15s, transform .15s;
      }
      .species-btn svg{ width:74px; height:auto; }
      .species-btn .who{ font-family:"ZCOOL KuaiLe",sans-serif; font-size:1.1rem; }
      .species-btn .sound{ font-size:.8rem; color:var(--ink-soft); }
      .species-btn[aria-pressed="true"]{ border-color:var(--coral); background:#fff1ec; }
      .swatches{ display:flex; flex-wrap:wrap; gap:10px; }
      .swatch{
        width:46px; height:46px; border-radius:50%; border:3px solid #fff;
        box-shadow:0 0 0 2px var(--line), 0 4px 8px rgba(0,0,0,.08); padding:0; position:relative;
      }
      .swatch[aria-pressed="true"]{ box-shadow:0 0 0 3px var(--coral), 0 4px 8px rgba(0,0,0,.1); }
      .swatch .pat{ position:absolute; inset:0; border-radius:50%; overflow:hidden; }
      .name-row{ display:flex; gap:10px; }
      .name-row input{
        flex:1; min-width:0; border:2px solid var(--line); border-radius:14px; padding:10px 14px;
        font-size:1.05rem; font-family:inherit; background:#fffdf8; color:var(--ink); outline:none;
      }
      .name-row input:focus{ border-color:var(--sun); }
      .dice-btn{
        border:2px solid var(--line); background:#fff; border-radius:14px; padding:0 16px;
        font-size:.95rem; color:var(--ink); white-space:nowrap;
      }
      .go-btn{
        margin-top:2px; border:none; border-radius:16px; padding:15px 20px;
        background:var(--coral); color:#fff; font-family:"ZCOOL KuaiLe",sans-serif; font-size:1.3rem;
        box-shadow:0 8px 18px rgba(255,90,78,.35); transition:background .15s, transform .1s;
      }
      .go-btn:hover{ background:var(--coral-dark); }
      .go-btn:active{ transform:scale(.98); }
      .entry-foot{ text-align:center; color:var(--ink-soft); font-size:.85rem; margin-top:18px; }

      /* ---------- 校园 ---------- */
      #app{ display:none; max-width:1180px; margin:0 auto; padding:14px 14px 40px; }
      #app.on{ display:block; }
      .topbar{
        display:flex; flex-wrap:wrap; align-items:center; gap:10px;
        background:var(--card); border:1.5px solid var(--line); border-radius:18px;
        padding:10px 14px; box-shadow:var(--shadow);
      }
      .me-chip{ display:flex; align-items:center; gap:10px; min-width:0; }
      .me-chip .mini{ width:44px; height:44px; border-radius:50%; background:linear-gradient(180deg,#d6f0ff,#e6f9e2); display:flex; align-items:flex-end; justify-content:center; overflow:hidden; flex:none; }
      .me-chip .mini svg{ width:40px; height:auto; }
      .me-chip .nm{ font-family:"ZCOOL KuaiLe",sans-serif; font-size:1.1rem; line-height:1.15; }
      .me-chip .sub{ font-size:.78rem; color:var(--ink-soft); }
      .top-spacer{ flex:1; }
      .stat-pill{
        display:inline-flex; align-items:center; gap:7px; background:#f2fbf3; border:1.5px solid #cdeeda;
        color:#23713a; border-radius:999px; padding:7px 14px; font-size:.92rem; font-weight:600;
      }
      .treat-pill{
        display:inline-flex; align-items:center; gap:7px; background:#fff7e0; border:1.5px solid #f3dfa0;
        border-radius:999px; padding:7px 14px; font-size:.92rem; font-weight:600; color:#8a6414;
      }
      .ghost-btn{
        border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:8px 16px;
        font-size:.9rem; color:var(--ink-soft);
      }
      .ghost-btn:hover{ color:var(--ink); border-color:#dcc9a8; }

      .layout{ display:grid; grid-template-columns:1fr 300px; gap:16px; margin-top:16px; align-items:start; }
      .main-col{ min-width:0; }
      .side-col{ display:flex; flex-direction:column; gap:16px; }

      .tabs{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:12px; }
      .tab{
        border:2px solid var(--line); background:#fff; border-radius:16px; padding:10px 6px 8px;
        display:flex; flex-direction:column; align-items:center; gap:1px; color:var(--ink);
        transition:border-color .15s, background .15s;
      }
      .tab .t-name{ font-family:"ZCOOL KuaiLe",sans-serif; font-size:1.08rem; }
      .tab .t-count{ font-size:.76rem; color:var(--ink-soft); }
      .tab[aria-selected="true"]{ border-color:var(--coral); background:#fff3ef; }
      .tab[aria-selected="true"] .t-count{ color:var(--coral-dark); font-weight:700; }

      .scene{
        position:relative; border-radius:24px; overflow:hidden; box-shadow:var(--shadow);
        border:1.5px solid var(--line); aspect-ratio:16/10.4; background:#bfe6ff;
      }
      .scene .bg{ position:absolute; inset:0; width:100%; height:100%; }
      .scene .room{ position:absolute; inset:0; display:none; }
      .scene .room.on{ display:block; }
      .pets-layer{ position:absolute; inset:0; }

      .pet{
        position:absolute; width:clamp(58px,11.5%,96px); transform:translate(-50%,-96%);
        transition:left 4.5s linear, top 4.5s linear; z-index:5; pointer-events:none;
      }
      .pet .flip{ transition:transform .3s; }
      .pet svg{ width:100%; height:auto; filter:drop-shadow(0 5px 4px rgba(60,40,10,.18)); }
      .pet .tag{
        position:absolute; left:50%; transform:translateX(-50%); bottom:-4px;
        background:rgba(255,255,255,.94); border-radius:999px; padding:1px 9px;
        font-size:.72rem; font-weight:600; white-space:nowrap; box-shadow:0 2px 5px rgba(0,0,0,.12);
      }
      .pet.me .tag{ background:var(--coral); color:#fff; }
      .pet.me svg{ filter:drop-shadow(0 0 0 transparent) drop-shadow(0 5px 4px rgba(60,40,10,.2)); }
      .pet.me::after{
        content:""; position:absolute; left:50%; bottom:-9px; transform:translateX(-50%);
        width:62%; height:12px; border-radius:50%; border:2.5px solid var(--sun);
        background:rgba(255,181,46,.18);
      }
      .bubble{
        position:absolute; left:50%; bottom:calc(100% + 8px); transform:translateX(-50%) scale(.6);
        background:#fff; color:var(--ink); border-radius:14px; padding:6px 12px;
        font-size:.85rem; font-weight:600; white-space:nowrap; max-width:210px;
        box-shadow:0 5px 14px rgba(60,40,10,.16); opacity:0; pointer-events:none;
        transition:opacity .18s, transform .18s; z-index:9;
      }
      .bubble::after{
        content:""; position:absolute; left:50%; bottom:-6px; transform:translateX(-50%);
        border:7px solid transparent; border-top-color:#fff; border-bottom:none;
      }
      .bubble.show{ opacity:1; transform:translateX(-50%) scale(1); }
      .bubble.big{ font-size:1.05rem; font-family:"ZCOOL KuaiLe",sans-serif; }
      .zzz{
        position:absolute; right:-4px; top:-8px; font-family:"ZCOOL KuaiLe",sans-serif;
        color:#7d9bbd; font-size:.95rem; animation:floatUp 2.2s ease-in-out infinite;
      }
      @keyframes floatUp{ 0%,100%{transform:translateY(0) rotate(6deg); opacity:.65} 50%{transform:translateY(-7px) rotate(-4deg); opacity:1} }
      .heart-pop{
        position:absolute; left:50%; top:-6px; transform:translateX(-50%);
        color:#ff7d9c; font-size:1.05rem; animation:heartUp 1.4s ease-out forwards; pointer-events:none; z-index:10;
      }
      @keyframes heartUp{ 0%{opacity:0; transform:translate(-50%,6px) scale(.6)} 25%{opacity:1} 100%{opacity:0; transform:translate(-50%,-30px) scale(1.15)} }

      .ball{
        position:absolute; width:44px; height:44px; border-radius:50%; cursor:pointer; z-index:8;
        background:radial-gradient(circle at 32% 30%, #ff9a8a, var(--coral) 62%, #d63a30);
        box-shadow:0 6px 10px rgba(120,40,20,.3), inset 0 -6px 8px rgba(0,0,0,.14);
        border:3px solid #fff; min-height:44px; transition:left .55s ease, top .55s ease;
      }
      .ball::after{ content:""; position:absolute; inset:7px; border:2.5px dashed rgba(255,255,255,.75); border-radius:50%; }

      .actions{
        display:flex; flex-wrap:wrap; gap:10px; margin-top:14px;
        background:var(--card); border:1.5px solid var(--line); border-radius:18px; padding:12px;
        box-shadow:var(--shadow);
      }
      .act-btn{
        flex:1 1 auto; border:2px solid var(--line); background:#fffaf1; border-radius:14px;
        padding:11px 14px; font-size:1rem; font-weight:600; color:var(--ink);
        display:inline-flex; align-items:center; justify-content:center; gap:8px;
        transition:border-color .15s, background .15s, transform .08s; min-height:48px;
      }
      .act-btn:hover{ border-color:#e5cfa4; background:#fff3da; }
      .act-btn:active{ transform:scale(.97); }
      .act-btn.speak{ background:var(--coral); border-color:var(--coral); color:#fff; font-family:"ZCOOL KuaiLe",sans-serif; font-size:1.12rem; box-shadow:0 6px 14px rgba(255,90,78,.3); }
      .act-btn.speak:hover{ background:var(--coral-dark); border-color:var(--coral-dark); }
      .act-btn .ico{ width:22px; height:22px; flex:none; }

      .panel{
        background:var(--card); border:1.5px solid var(--line); border-radius:18px;
        box-shadow:var(--shadow); padding:16px;
      }
      .panel h3{ font-family:"ZCOOL KuaiLe",sans-serif; font-size:1.12rem; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
      .feed{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; max-height:342px; overflow:hidden; }
      .feed li{ font-size:.88rem; line-height:1.45; color:var(--ink-soft); display:flex; gap:8px; animation:feedIn .35s ease; }
      .feed li b{ color:var(--ink); font-weight:700; }
      .feed li .tm{ color:#b7a888; font-size:.76rem; flex:none; padding-top:2px; }
      @keyframes feedIn{ from{opacity:0; transform:translateY(-5px)} to{opacity:1; transform:none} }
      .schedule{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px; }
      .schedule li{
        display:flex; align-items:center; gap:10px; font-size:.9rem; padding:8px 11px;
        border-radius:11px; background:#fffaf1; border:1.5px solid transparent;
      }
      .schedule li .tm{ font-weight:700; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
      .schedule li.now{ background:#fff1ec; border-color:#ffd3cb; }
      .schedule li.now .tm{ color:var(--coral-dark); }
      .schedule li .doing{ margin-left:auto; font-size:.74rem; color:var(--coral-dark); font-weight:700; }

      .roster-head{ display:flex; align-items:baseline; gap:12px; margin:26px 2px 12px; flex-wrap:wrap; }
      .roster-head h2{ font-family:"ZCOOL KuaiLe",sans-serif; font-size:1.5rem; margin:0; }
      .roster-head span{ color:var(--ink-soft); font-size:.9rem; }
      .roster{ display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:12px; }
      .mate{
        background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:12px 12px 10px;
        display:flex; flex-direction:column; align-items:center; text-align:center; gap:2px;
        box-shadow:0 4px 12px rgba(93,64,28,.06);
      }
      .mate .ava{ width:76px; height:64px; display:flex; align-items:flex-end; justify-content:center; }
      .mate .ava svg{ width:72px; height:auto; }
      .mate .nm{ font-family:"ZCOOL KuaiLe",sans-serif; font-size:1.02rem; }
      .mate .where{ font-size:.78rem; color:var(--ink-soft); }
      .mate .doing{
        margin-top:5px; font-size:.78rem; background:#f2fbf3; color:#23713a; border-radius:999px; padding:2px 10px; font-weight:600;
      }
      .mate.me-card{ border-color:var(--coral); background:#fff7f4; }
      .mate.me-card .doing{ background:#ffe9e5; color:var(--coral-dark); }

      .foot{ text-align:center; color:var(--ink-soft); font-size:.82rem; margin-top:30px; }


      /* ---------- 3D 场景 ---------- */
      #gl{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:manipulation; }
      #labels{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:6; }
      .scene-tip{
        position:absolute; left:50%; top:14px; transform:translateX(-50%); z-index:7;
        background:rgba(255,255,255,.93); border:1.5px solid var(--line); color:var(--ink-soft);
        border-radius:999px; padding:6px 14px; font-size:.85rem; white-space:nowrap;
        box-shadow:0 4px 10px rgba(93,64,28,.1); pointer-events:none;
      }
      .tag3d{ position:absolute; width:0; height:0; transform:translate(-50%,-100%); pointer-events:none; }
      .tag3d .p-tag{
        position:absolute; left:50%; bottom:-8px; transform:translateX(-50%);
        background:rgba(255,255,255,.94); border-radius:999px; padding:1px 9px;
        font-size:.72rem; font-weight:600; white-space:nowrap; box-shadow:0 2px 5px rgba(0,0,0,.12); color:var(--ink);
      }
      .tag3d.me .p-tag{ background:var(--coral); color:#fff; }
      .tag3d .p-bubble{
        position:absolute; left:50%; bottom:14px; transform:translateX(-50%) scale(.6);
        background:#fff; color:var(--ink); border-radius:14px; padding:6px 12px;
        font-size:.85rem; font-weight:600; white-space:nowrap; max-width:210px;
        box-shadow:0 5px 14px rgba(60,40,10,.16); opacity:0; pointer-events:none;
        transition:opacity .18s, transform .18s; z-index:9;
      }
      .tag3d .p-bubble::after{
        content:""; position:absolute; left:50%; bottom:-6px; transform:translateX(-50%);
        border:7px solid transparent; border-top-color:#fff; border-bottom:none;
      }
      .tag3d .p-bubble.show{ opacity:1; transform:translateX(-50%) scale(1); }
      .tag3d .p-bubble.big{ font-size:1.05rem; font-family:"ZCOOL KuaiLe",sans-serif; }
      .tag3d .heart-pop{ top:-30px; }
      .real-badge{
        background:#e1f0fb; color:#1668b0; border-radius:999px; padding:1px 8px;
        font-size:.72rem; font-weight:700; margin-left:5px; vertical-align:1px;
      }
      @media (max-width:900px){
        .layout{ grid-template-columns:1fr; }
        .feed{ max-height:250px; }
        .enroll{ grid-template-columns:minmax(0,1fr); }
        .preview-box{ min-height:190px; }
        #previewPet{ width:120px; }
        .scene{ aspect-ratio:4/3.4; }
        .pet{ width:clamp(52px,15%,84px); }
        .tabs{ gap:7px; }
        .tab .t-name{ font-size:.98rem; }
      }
      @media (prefers-reduced-motion: reduce){
        .pet{ transition:none; }
        #previewPet,.ball,.zzz,.dot{ animation:none; }
      }
    </style>
  </head>
  <body>

    <!-- ============ 入学大门 ============ -->
    <section id="entry">
      <div class="entry-wrap">
        <div class="gate">
          <svg viewBox="0 0 560 120" role="img" aria-label="宠物小学校门">
            <rect x="30" y="34" width="18" height="78" rx="6" fill="#e8836b"/>
            <rect x="512" y="34" width="18" height="78" rx="6" fill="#e8836b"/>
            <path d="M20 40 Q280 -28 540 40 L540 62 Q280 2 20 62 Z" fill="#ff8a5c"/>
            <rect x="118" y="6" width="324" height="46" rx="14" fill="#fff" stroke="#f0dfC6" stroke-width="2"/>
            <text x="280" y="39" text-anchor="middle" font-size="27" font-weight="700" fill="#3d3229" font-family="'ZCOOL KuaiLe','PingFang SC',sans-serif">宠 物 小 学</text>
            <circle cx="150" cy="29" r="5" fill="#ffb52e"/><circle cx="410" cy="29" r="5" fill="#57b96a"/>
            <path d="M70 112 q14 -16 28 0 M462 112 q14 -16 28 0" stroke="#57b96a" stroke-width="5" fill="none" stroke-linecap="round"/>
          </svg>
          <h1>欢迎来到<span class="accent">宠物小学</span></h1>
          <p>变成一只小猫或小狗，去上课、玩游戏、吃罐罐，再逛逛校园。</p>
          <div class="live-line"><span class="dot"></span><span>现在有 <b id="entryCount">24</b> 位同学在学校里</span></div>
        </div>

        <form class="enroll" id="enrollForm">
          <div class="preview-box">
            <span class="sun"></span><span class="cloud c1"></span><span class="cloud c2"></span>
            <div id="previewPet" aria-hidden="true"></div>
            <div class="preview-name" id="previewName">小 同 学</div>
          </div>
          <div class="form-side">
            <div>
              <div class="field-label"><span class="step">1</span>今天想当谁？</div>
              <div class="species-row">
                <button type="button" class="species-btn" id="spCat" aria-pressed="true">
                  <span class="sp-ava" data-sp="cat"></span>
                  <span class="who">小猫同学</span><span class="sound">上学路上喵喵叫</span>

		const max = accessor.max;

		if ( min !== undefined && max !== undefined ) {

					// to assume that each target can have a max weight of 1. However, for some use cases - notably, when morph targets

      /* ---------------- 进校园 ---------------- */
      /* ---------------- 3D 校园（Three.js） ---------------- */
      var T3 = { ok:false, failed:false, ready:false, scene:null, camera:null, renderer:null,
                 clock:null, templates:{}, petScale:.8, pending:[], ball:null, ballHit:null,
                 ballPct:{ x:60, y:66 }, ballTX:0, ballTZ:0, focusX:0, focusTX:0, lastW:0, lastH:0 };
      var ROOM3D_X = { classroom:0, playground:46, cafeteria:92, garden:138 };

      function allPets(){

      function petWorldX(m){ return ROOM3D_X[m.room] + (m.x / 100 - .5) * 14.5; }

      function box3(w, h, d, color, x, y, z, parent){
        var ms = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color:color }));
        ms.position.set(x, y, z); parent.add(ms); return ms;
      }
      function cyl3(rt, rb, h, color, x, y, z, parent){
        var ms = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 18), new THREE.MeshLambertMaterial({ color:color }));

      }
      function sph3(r, color, x, y, z, parent){
        var ms = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 14), new THREE.MeshLambertMaterial({ color:color }));
        ms.position.set(x, y, z); parent.add(ms); return ms;
      }
      function ground3(color, cx){
        var g = new THREE.Mesh(new THREE.PlaneGeometry(17, 10.6), new THREE.MeshLambertMaterial({ color:color }));
        g.rotation.x = -Math.PI / 2; g.position.set(cx, 0, 0); T3.scene.add(g);
      }
      function tree3(cx, dx, dz, leafColor){
        var g = new THREE.Group(); g.position.set(cx + dx, 0, dz); T3.scene.add(g);
        cyl3(.2, .3, 1.7, 0x9a6a3f, 0, .85, 0, g);
        sph3(1.35, leafColor, 0, 2.5, 0, g);
        sph3(.95, leafColor, -.95, 1.95, .2, g);
        sph3(1.0, leafColor, .95, 2.0, -.15, g);

      function desk3(cx, dx, dz){
        var g = new THREE.Group(); g.position.set(cx + dx, 0, dz); T3.scene.add(g);

      function table3(cx, dx, dz){
        var g = new THREE.Group(); g.position.set(cx + dx, 0, dz); T3.scene.add(g);

        for(var i = 0; i < 6; i++){

          sph3(.14, colors[i % colors.length], Math.cos(a) * .6, .3, Math.sin(a) * .6, g);

      function buildRooms(){

        desk3(cx, -4.8, 1.9); desk3(cx, 0, 2.2); desk3(cx, 4.8, 1.9);

        box3(.7, .16, .5, 0xff8fa3, cx - 4.8, .78, 1.9, T3.scene);
        box3(.7, .16, .5, 0x5aa9e6, cx + 4.8, .78, 1.9, T3.scene);
        /* 操场 */
        cx = ROOM3D_X.playground;
        ground3(0x79c765, cx);
        var track = new THREE.Mesh(new THREE.RingGeometry(2.5, 4.3, 42), new THREE.MeshLambertMaterial({ color:0xe08a5f, side:THREE.DoubleSide }));
        track.rotation.x = -Math.PI / 2; track.position.set(cx + .4, .02, .3); T3.scene.add(track);
        tree3(cx, -6.2, -2.8, 0x4fae5c);
        sph3(.5, 0xffffff, cx + 6.4, .5, -3.4, T3.scene);
        /* 食堂 */
        cx = ROOM3D_X.cafeteria;
        ground3(0xe8b07e, cx);
        box3(17, 5.6, .3, 0xfff1dc, cx, 2.8, -5.3, T3.scene);
        box3(4.8, 1.05, .16, 0x3f6b57, cx, 3.6, -5.08, T3.scene);
        box3(8.8, 1.15, 1.3, 0xe8836b, cx, .58, -3.5, T3.scene);
        box3(9.0, .12, 1.55, 0xfdf6d8, cx, 1.22, -3.5, T3.scene);
        cyl3(.34, .26, .16, 0xffb52e, cx - 2.6, 1.36, -3.5, T3.scene);
        cyl3(.34, .26, .16, 0xff8fa3, cx, 1.36, -3.5, T3.scene);
        cyl3(.34, .26, .16, 0x8fd07f, cx + 2.6, 1.36, -3.5, T3.scene);
        table3(cx, -4.6, 1.9); table3(cx, .2, 2.5); table3(cx, 5.0, 1.8);
        /* 花园 */
        cx = ROOM3D_X.garden;
        ground3(0x8fd07f, cx);
        var p1 = box3(1.7, .05, 3.6, 0xf3dfae, cx - 1.4, .03, 2.8, T3.scene); p1.rotation.y = .3;
        var p2 = box3(1.7, .05, 3.4, 0xf3dfae, cx + .5, .03, -.5, T3.scene); p2.rotation.y = -.22;
        var p3m = box3(1.7, .05, 3.2, 0xf3dfae, cx + 2.3, .03, -3.4, T3.scene); p3m.rotation.y = .18;
        tree3(cx, 6.0, -3.0, 0xffb7c9);
        tree3(cx, -6.4, -3.2, 0x57b96a);
        flowers3(cx, -4.6, 1.6, [0xff8fa3, 0xffd94d, 0xffffff]);
        flowers3(cx, 4.4, 2.6, [0xc39bff, 0xff8fa3, 0xffd94d]);
        flowers3(cx, -2.2, -3.4, [0xff9d5c, 0xffffff, 0xff8fa3]);
      }
      function buildBall(){
        T3.ball = sph3(.42, 0xff5a4e, ballWorldX(), .42, ballWorldZ(), T3.scene);
        var hit = new THREE.Mesh(new THREE.SphereGeometry(.95, 10, 8),
          new THREE.MeshBasicMaterial({ transparent:true, opacity:0, depthWrite:false }));
        hit.position.copy(T3.ball.position); T3.scene.add(hit); T3.ballHit = hit;
        T3.ballTX = T3.ball.position.x; T3.ballTZ = T3.ball.position.z;
      }
      function placeBall(){
        T3.ballPct.x = rand(10, 88); T3.ballPct.y = rand(58, 84);
        T3.ballTX = ballWorldX(); T3.ballTZ = ballWorldZ();
      }
      function onCanvasTap(ev){
        if(currentRoom !== "playground" || !T3.ballHit || !entered) return;
        var rect = T3.renderer.domElement.getBoundingClientRect();
        var nx = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
        var ny = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
        var rc = new THREE.Raycaster();
        rc.setFromCamera({ x:nx, y:ny }, T3.camera);
        var hits = rc.intersectObject(T3.ballHit);
        if(hits.length){
          gainTreat(1);
          showBubble(me, me.species === "cat" ? "追到啦！+1 小鱼干" : "叼回来啦！+1 骨头饼干", 2200);
          popHeart(me);
          placeBall();
        }
      }
      function resizeGL(){
        var wrap = document.getElementById("scene");
        if(!wrap || !T3.renderer) return;
        var w = wrap.clientWidth, h = wrap.clientHeight;
        if(!w || !h) return;
        T3.lastW = w; T3.lastH = h;
        T3.renderer.setSize(w, h, false);
        T3.camera.aspect = w / h;
        T3.camera.updateProjectionMatrix();
      }
      function b64buf(b64){
        var bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
        for(var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
        return bytes.buffer;
      }
      function modelFail(){
        if(sceneTip){
          sceneTip.style.display = "block";
          sceneTip.textContent = "小猫小狗模型没加载出来，刷新一下试试";
        }
      }
      function loadModels(){
        var loader = new GLTFLoader();
        var done = 0;
        [["cat", window.CAT_GLB_B64], ["dog", window.DOG_GLB_B64]].forEach(function(pair){
          if(!pair[1]){ modelFail(); return; }
          try{
            loader.parse(b64buf(pair[1]), "", function(gltf){
              T3.templates[pair[0]] = { scene: gltf.scene, anims: gltf.animations };
              if(pair[0] === "cat"){
                var bb = new THREE.Box3().setFromObject(gltf.scene);
                var h = Math.max(.5, bb.max.y - bb.min.y);
                T3.petScale = 1.12 / h;
              }
              done++;
              if(done === 2){
                T3.ready = true;
                if(sceneTip) sceneTip.style.display = "none";
                var pend = T3.pending.slice(); T3.pending = [];
                pend.forEach(function(m){ if(!m.p3) makePet(m); });
                allPets().forEach(function(m){ if(!m.p3 && pend.indexOf(m) < 0) makePet(m); });
              }
            }, function(){ modelFail(); });
          }catch(e){ modelFail(); }
        });
      }
      function initThree(){
        if(!window.THREE || !GLTFLoader){
          T3.failed = true;
          if(sceneTip) sceneTip.textContent = "3D 校园没加载出来，刷新一下试试（名册和动态墙还能看）";
          return;
        }
        try{
          var canvas = document.getElementById("gl");
          var renderer = new THREE.WebGLRenderer({ canvas:canvas, antialias:true });
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          renderer.outputColorSpace = THREE.SRGBColorSpace;
          T3.renderer = renderer;
          var scene = new THREE.Scene();
          scene.background = new THREE.Color(0xbfe6ff);
          T3.scene = scene;
          T3.camera = new THREE.PerspectiveCamera(40, 1.5, .1, 400);
          scene.add(new THREE.HemisphereLight(0xffffff, 0x9a8a68, .95));
          var sun = new THREE.DirectionalLight(0xfff1d6, .8);
          sun.position.set(8, 14, 9); scene.add(sun);
          buildRooms();
          buildBall();
          T3.clock = new THREE.Clock();
          T3.ok = true;
          resizeGL();
          window.addEventListener("resize", resizeGL);
          canvas.addEventListener("pointerdown", onCanvasTap);
          requestAnimationFrame(loop3d);
          loadModels();
        }catch(e){
          T3.failed = true;
          if(sceneTip) sceneTip.textContent = "3D 校园没加载出来，刷新一下试试（名册和动态墙还能看）";
        }
      }

      /* ---------------- 3D 宠物 ---------------- */
      function makePet(m){
        var tpl = T3.templates[m.species];
        if(!tpl) return;
        var g = tpl.scene.clone(true);
        var fur = new THREE.Color(coatById(m.coat).fur);
        g.traverse(function(o){
          if(o.isMesh){
            o.material = o.material.clone();
            o.material.color = fur;
          }
        });
        g.scale.setScalar(T3.petScale);
        var mixer = new THREE.AnimationMixer(g);
        var acts = {};
        tpl.anims.forEach(function(clip){ acts[clip.name] = mixer.clipAction(clip, g); });
        var tail = null;
        g.traverse(function(o){ if(o.name === "tail") tail = o; });
        T3.scene.add(g);
        var lab = document.createElement("div");
        lab.className = "tag3d" + (m.isMe ? " me" : "");
        var bub = document.createElement("div"); bub.className = "p-bubble";
        var tag = document.createElement("div"); tag.className = "p-tag";
        tag.textContent = m.name + (m.isMe ? "（我）" : (m.isRemote ? " · 真人" : ""));
        lab.appendChild(bub); lab.appendChild(tag);
        lab.style.display = "none";
        labelsBox.appendChild(lab);
        m.p3 = { group:g, mixer:mixer, acts:acts, cur:null, tail:tail, tailPrev:0,
                 label:lab, bubble:bub, phase: Math.random() * 6.28 };
        placePet(m);
      }
      function renderPet(m){
        if(m.p3){ placePet(m); return; }
        if(T3.ready){ makePet(m); return; }
        if(T3.failed || !T3.ok) return;
        if(T3.pending.indexOf(m) < 0) T3.pending.push(m);
      }
      function placePet(m){
        m.tx = m.x; m.ty = m.y;
        if(m.p3) m.p3.group.position.set(petWorldX(m), 0, petWorldZ(m));
      }
      function removePet(m){
        if(m.p3){
          if(m.p3.label && m.p3.label.parentNode) m.p3.label.parentNode.removeChild(m.p3.label);
          if(T3.scene) T3.scene.remove(m.p3.group);
          m.p3 = null;
        }
        var i = T3.pending.indexOf(m);
        if(i >= 0) T3.pending.splice(i, 1);
      }
      function movePet(m, x, y){
        m.tx = Math.min(92, Math.max(8, x));
        m.ty = Math.min(91, Math.max(57, y));
      }
      function playAnim(m, name, ms){
        m.animClip = name;
        m.animUntil = performance.now() + (ms || 3000);
      }
      function setState(m, state, ms){
        m.state = state;
        if(m.stateTimer) clearTimeout(m.stateTimer);
        if(ms){
          m.stateTimer = setTimeout(function(){
            if(m.state === state) m.state = "idle";
          }, ms);
        }
      }
      function showBubble(m, text, ms, big){
        if(!m.p3 || !m.p3.bubble) return;
        var b = m.p3.bubble;
        b.textContent = text;
        b.classList.toggle("big", !!big);
        b.classList.add("show");
        if(m.bubbleTimer) clearTimeout(m.bubbleTimer);
        m.bubbleTimer = setTimeout(function(){ b.classList.remove("show"); }, ms || 2600);
      }
      function popHeart(m){
        if(!m.p3 || !m.p3.label) return;
        var h = document.createElement("span");
        h.className = "heart-pop"; h.textContent = "♥";
        m.p3.label.appendChild(h);
        setTimeout(function(){ h.remove(); }, 1450);
      }
      function desiredClip(m){
        if(m.animClip && performance.now() < m.animUntil) return m.animClip;
        if(m.moving) return m.state === "play" ? "run" : "walk";
        return STATE_CLIP[m.state] || "idle";
      }
      function applyClip(m){
        var p = m.p3;
        if(!p || !p.acts) return;
        var name = desiredClip(m);
        if(!p.acts[name]) name = "idle";
        if(p.cur === name || !p.acts[name]) return;
        var next = p.acts[name];
        var prev = p.cur ? p.acts[p.cur] : null;
        next.reset().setLoop(THREE.LoopRepeat, Infinity).fadeIn(.18).play();
        if(prev && prev !== next) prev.fadeOut(.18);
        p.cur = name;
      }
      function stepPet(m, dt){
        var p = m.p3;
        var tx = (m.tx != null ? m.tx : m.x), ty = (m.ty != null ? m.ty : m.y);
        var dx = tx - m.x, dy = ty - m.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        m.moving = dist > .6;
        if(m.moving){
          var sp = 9 * dt;
          if(sp >= dist){ m.x = tx; m.y = ty; }
          else { m.x += dx / dist * sp; m.y += dy / dist * sp; }
          if(Math.abs(dx) > .2) m.dir = dx < 0 ? -1 : 1;
        }
        p.group.position.set(petWorldX(m), 0, petWorldZ(m));
        var targetRot = m.dir < 0 ? -Math.PI / 2 : Math.PI / 2;
        var d = targetRot - p.group.rotation.y;
        while(d > Math.PI) d -= Math.PI * 2;
        while(d < -Math.PI) d += Math.PI * 2;
        p.group.rotation.y += d * Math.min(1, dt * 10);
      }
      function projectLabel(m){
        var p = m.p3;
        if(!V3) V3 = new THREE.Vector3();
        V3.copy(p.group.position); V3.y += 1.6;
        V3.project(T3.camera);
        if(V3.z >= 1){ p.label.style.display = "none"; return; }
        var w = T3.renderer.domElement.clientWidth, h = T3.renderer.domElement.clientHeight;
        p.label.style.left = ((V3.x * .5 + .5) * w) + "px";
        p.label.style.top = ((-V3.y * .5 + .5) * h) + "px";
        p.label.style.display = "block";
      }
      function loop3d(){
        requestAnimationFrame(loop3d);
        if(!T3.renderer) return;
        var wrap = document.getElementById("scene");
        if(wrap && (wrap.clientWidth !== T3.lastW || wrap.clientHeight !== T3.lastH)) resizeGL();
        var dt = Math.min(.05, T3.clock.getDelta());
        var t = T3.clock.elapsedTime;
        T3.focusX += (T3.focusTX - T3.focusX) * Math.min(1, dt * 3.4);
        T3.camera.position.set(T3.focusX, 12.2, 13.8);
        T3.camera.lookAt(T3.focusX, .2, -.8);
        if(T3.ball){
          T3.ball.position.x += (T3.ballTX - T3.ball.position.x) * Math.min(1, dt * 5);
          T3.ball.position.z += (T3.ballTZ - T3.ball.position.z) * Math.min(1, dt * 5);
          T3.ball.position.y = .42 + Math.abs(Math.sin(t * 2.2)) * .07;
          T3.ball.rotation.z -= dt * 1.2;
          if(T3.ballHit) T3.ballHit.position.copy(T3.ball.position);
        }
        var pets = allPets();
        for(var i = 0; i < pets.length; i++){
          var m = pets[i];
          if(!m.p3) continue;
          var vis = m.room === currentRoom;
          m.p3.group.visible = vis;
          if(!vis){ m.p3.label.style.display = "none"; continue; }
          stepPet(m, dt);
          applyClip(m);
          m.p3.mixer.update(dt);
          if(m.p3.tail){
            var wv = Math.sin(t * 3.4 + m.p3.phase) * .38;
            m.p3.tail.rotateY(wv - m.p3.tailPrev);
            m.p3.tailPrev = wv;
          }
          projectLabel(m);
        }
        T3.renderer.render(T3.scene, T3.camera);
      }
      initThree();

      /* ---------------- 动态墙 & 名册 ---------------- */
      var feedEl = $("#feed");
      function feed(html){
        var li = document.createElement("li");
        li.innerHTML = '<span class="tm">'+nowTime()+'</span><span>'+html+'</span>';
        feedEl.insertBefore(li, feedEl.firstChild);
        while(feedEl.children.length > 14) feedEl.removeChild(feedEl.lastChild);
      }
      function renderRoster(){
        var box = $("#roster"); box.innerHTML = "";
        var all = [me].concat(classmates);
        if(typeof remotes !== "undefined") all = all.concat(remotes);
        all.forEach(function(m){
          var card = document.createElement("div");
          card.className = "mate" + (m.isMe ? " me-card" : "");
          card.innerHTML =
            '<div class="ava">' + petSVG(m.species, coatById(m.coat), m.pattern, m.state === "sleep" ? "sleep" : "idle") + '</div>' +
            '<div class="nm">' + escapeHtml(m.name) + (m.isMe ? "（我）" : "") + (m.isRemote ? '<span class="real-badge">真人</span>' : "") + '</div>' +
            '<div class="where">' + (m.species === "cat" ? "小猫" : "小狗") + ' · 在' + ROOMS[m.room].name + '</div>' +
            '<div class="doing">' + escapeHtml(m.action || "") + '</div>';
          box.appendChild(card);
        });
      }
      function escapeHtml(s){
        return String(s).replace(/[&<>"']/g, function(c){
          return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
        });
      }
      function updateCounts(){
        var remoteN = (typeof remotes !== "undefined") ? remotes.length : 0;
        var total = classmates.length + remoteN + (entered ? 1 : 0);
        $("#onlineCount").textContent = total;
        $("#entryCount").textContent = classmates.length + remoteN;
        ROOM_KEYS.forEach(function(k){
          var n = classmates.filter(function(m){ return m.room === k; }).length
                + (typeof remotes !== "undefined" ? remotes.filter(function(m){ return m.room === k; }).length : 0)
                + (me.room === k && entered ? 1 : 0);
          var el = $('.t-count[data-count="'+k+'"]');
          if(el) el.textContent = n + " 位同学";
        });
      }
      /* ---------------- 课表 ---------------- */
      var SCHEDULE = [
        { t:"08:00", label:"晨读：一起喵喵汪汪", room:"classroom" },
        { t:"09:30", label:"文化课：认小鱼干和骨头", room:"classroom" },
        { t:"10:30", label:"体育课：操场追皮球", room:"playground" },
        { t:"12:00", label:"午饭：食堂吃罐罐", room:"cafeteria" },
        { t:"13:00", label:"午睡时间：全校打盹", room:"classroom" },
        { t:"15:00", label:"自然课：花园扑蝴蝶", room:"garden" },
        { t:"16:30", label:"自由活动：逛逛校园", room:"garden" }
      ];
      function renderSchedule(){
        var ul = $("#schedule"); ul.innerHTML = "";
        var now = new Date(); var mins = now.getHours()*60 + now.getMinutes();
        var cur = 0;
        SCHEDULE.forEach(function(s, i){
          var p = s.t.split(":"); var sm = (+p[0])*60 + (+p[1]);
          if(mins >= sm) cur = i;
        });
        SCHEDULE.forEach(function(s, i){
          var li = document.createElement("li");
          if(i === cur) li.className = "now";
          li.innerHTML = '<span class="tm">'+s.t+'</span><span>'+s.label+'</span>' + (i === cur ? '<span class="doing">进行中</span>' : '');
          ul.appendChild(li);
        });
      }

      /* ---------------- 房间 & 动作 ---------------- */
      var ACTIONS = {
        classroom: [
          { label:"认真听课", anim:"idle", run:function(){ setState(me,"study",4200); me.action="认真听课"; showBubble(me, pick(["（认真记笔记）","原来 1+1 = 两根小鱼干","听懂啦！"]), 2800); } },
          { label:"举爪提问", anim:"gesture-positive", run:function(){ me.action="举爪提问"; showBubble(me, pick(["老师，罐罐什么时候发？","老师，我想去操场玩","这道题我会，我真会！"]), 3000); reactNearby(); } },
          { label:"偷偷打盹", anim:"static", run:function(){ setState(me,"sleep",4600); me.action="偷偷打盹"; showBubble(me, "呼…呼…", 2600); } }
        ],
        playground: [
          { label:"追皮球", anim:"run", run:function(){ setState(me,"play",4200); me.action="追皮球"; movePet(me, rand(14,86), rand(60,90)); showBubble(me, me.species==="cat" ? "喵！球别跑！" : "汪汪！追上啦！", 2600); } },
          { label:"晒太阳", anim:"static", run:function(){ setState(me,"sleep",4600); me.action="晒太阳"; showBubble(me, "好暖和，肚皮都晒热了", 3000); } },
          { label:"草地打滚", anim:"dance", run:function(){ setState(me,"play",4200); me.action="草地打滚"; movePet(me, rand(14,86), rand(62,90)); showBubble(me, "打滚中——停不下来！", 2800); popHeart(me); } }
        ],
        cafeteria: [
          { label:"吃罐罐", anim:"eat", run:function(){ setState(me,"eat",4600); me.action="吃罐罐"; showBubble(me, "吧唧吧唧…太好吃了！", 3000); gainTreat(1); } },
          { label:"喝牛奶", anim:"eat", run:function(){ setState(me,"eat",3800); me.action="喝牛奶"; showBubble(me, "咕嘟咕嘟，胡子都沾上奶了", 3000); } },
          { label:"排队等加餐", anim:"idle", run:function(){ me.action="排队等加餐"; showBubble(me, "排队中…前面还有 3 只", 3000); setTimeout(function(){ showBubble(me, "到我啦到我啦！", 2400); popHeart(me); }, 3100); } }
        ],
        garden: [
          { label:"闻花花", anim:"gesture-positive", run:function(){ me.action="闻花花"; movePet(me, rand(12,88), rand(60,90)); showBubble(me, "阿嚏——花花好香", 2800); } },
          { label:"扑蝴蝶", anim:"dance", run:function(){ setState(me,"play",4200); me.action="扑蝴蝶"; movePet(me, rand(12,88), rand(58,88)); showBubble(me, "蝴蝶别飞！就聊五分钟！", 2900); } },
          { label:"慢慢散步", anim:"walk", run:function(){ me.action="慢慢散步"; movePet(me, rand(12,88), rand(60,90)); showBubble(me, "逛逛校园，心情好好", 2800); } }
        ]
      };
      function renderActions(){
        var box = $("#actions"); box.innerHTML = "";
        var speak = document.createElement("button");
        speak.type = "button"; speak.className = "act-btn speak";
        speak.textContent = me.species === "cat" ? "喵一声" : "汪一声";
        speak.addEventListener("click", doSpeak);
        box.appendChild(speak);
        ACTIONS[currentRoom].forEach(function(a){
          var b = document.createElement("button");
          b.type = "button"; b.className = "act-btn"; b.textContent = a.label;
          b.addEventListener("click", function(){
            a.run();
            if(a.anim) playAnim(me, a.anim, 3400);
            netAction(a.label, a.anim);
            renderRoster();
          });
          box.appendChild(b);
        });
      }
      function switchRoom(room){
        currentRoom = room; me.room = room;
        $$(".tab").forEach(function(t){ t.setAttribute("aria-selected", t.getAttribute("data-room") === room ? "true" : "false"); });
        T3.focusTX = ROOM3D_X[room];
        me.x = rand(30,70); me.y = rand(64,86);
        placePet(me);
        renderActions(); updateCounts(); renderRoster();
        netRoomChanged();
      }
      $$(".tab").forEach(function(t){
        t.addEventListener("click", function(){ switchRoom(t.getAttribute("data-room")); });
      });

      /* ---------------- 叫声（WebAudio 合成） ---------------- */
      var actx = null;
      function audio(){
        if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; } }
        if(actx && actx.state === "suspended") actx.resume();
        return actx;
      }
      function playMeow(){
        var ac = audio(); if(!ac) return;
        var t = ac.currentTime;
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(620, t);
        o.frequency.exponentialRampToValueAtTime(880, t + .12);
        o.frequency.exponentialRampToValueAtTime(420, t + .38);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(.22, t + .06);
        g.gain.exponentialRampToValueAtTime(.0001, t + .42);
        o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .45);
      }
      function playBark(){
        var ac = audio(); if(!ac) return;
        [0, .22].forEach(function(off){
          var t = ac.currentTime + off;
          var o = ac.createOscillator(), g = ac.createGain();
          o.type = "square";
          o.frequency.setValueAtTime(340, t);
          o.frequency.exponentialRampToValueAtTime(140, t + .13);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(.14, t + .02);
          g.gain.exponentialRampToValueAtTime(.0001, t + .15);
          o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .17);
        });
      }
      function doSpeak(){
        var text;
        if(me.species === "cat"){ playMeow(); text = pick(["喵~","喵呜~","咪——","喵！"]); }
        else { playBark(); text = pick(["汪汪！","汪~","呜汪！","汪汪汪！"]); }
        showBubble(me, text, 2400, true);
        netSpeak(text);
        reactNearby();
      }
      function reactNearby(){
        var near = classmates.filter(function(m){ return m.room === currentRoom; });
        if(!near.length) return;
        var m = pick(near);
        setTimeout(function(){
          showBubble(m, m.species === "cat" ? pick(["喵~","咪！","呼噜~"]) : pick(["汪！","汪汪~","呜汪"]), 2200);
          if(Math.random() < .4) popHeart(m);
        }, rand(500, 1100));
      }

      /* ---------------- 零食 & 皮球 ---------------- */
      function gainTreat(n){
        treats += n;
        $("#treatCount").textContent = treats;
        $("#treatIco").textContent = me.species === "cat" ? "小鱼干" : "骨头饼干";
      }
      /* 皮球已经搬进 3D 操场：点 3D 红球得零食，placeBall 在 3D 部分定义 */

      /* ---------------- 同学模拟 ---------------- */
      function mateWander(m){
        movePet(m, Math.min(92, Math.max(8, m.x + rand(-16,16))), Math.min(91, Math.max(57, m.y + rand(-7,7))));
      }
      function mateAct(){
        if(!classmates.length) return;
        var m = pick(classmates);
        var r = Math.random();
        if(r < .30){
          mateWander(m);
        } else if(r < .52){
          var line = m.species === "cat" ? pick(CAT_LINES) : pick(DOG_LINES);
          if(m.room === currentRoom) showBubble(m, line, rand(2200, 3200));
        } else if(r < .72){
          m.action = pick(ROOMS[m.room].actions);
          var st = "idle";
          if(/打盹|晒太阳|看云/.test(m.action)) st = "sleep";
          else if(/吃|喝|吧唧|舔盘|等加餐/.test(m.action)) st = "eat";
          else if(/追|扑|打滚|跑圈/.test(m.action)) st = "play";
          else if(/听课|翻绘本|练写字/.test(m.action)) st = "study";
          setState(m, st, rand(4000, 7000));
          if(Math.random() < .35){
            feed("<b>" + m.name + "</b> 在" + ROOMS[m.room].name + m.action);
          }
        } else if(r < .82){
          var old = m.room;
          var next = pick(ROOM_KEYS.filter(function(k){ return k !== old; }));
          m.room = next; m.x = rand(14,86); m.y = rand(62,89);
          m.action = pick(ROOMS[next].actions);
          placePet(m);
          feed("<b>" + m.name + "</b> 从" + ROOMS[old].name + "跑去" + ROOMS[next].name + "了");
          updateCounts();
        } else if(r < .90){
          if(m.room === currentRoom && Math.random() < .6) popHeart(m);
          mateWander(m);
        }
        renderRoster();
      }
      function mateArriveLeave(){
        var r = Math.random();
        if(r < .42 && reserve.length){
          var name = reserve.splice(randi(0, reserve.length - 1), 1)[0];
          var species = CAT_NAMES.indexOf(name) >= 0 ? "cat" : "dog";
          var m = makeMate(name, species);
          m.action = pick(ROOMS[m.room].actions);
          classmates.push(m);
          renderPet(m);
          feed("<b>" + name + "</b> 背着书包来上学啦");
        } else if(r < .62 && classmates.length > 18){
          var idx = randi(0, classmates.length - 1);
          var gone = classmates.splice(idx, 1)[0];
          removePet(gone);
          reserve.push(gone.name);
          feed("<b>" + gone.name + "</b> 放学回家啦，明天见");
        }
        updateCounts(); renderRoster();
      }

      /* ---------------- 真人实时同步（Supabase Realtime） ---------------- */
      var remotes = [];
      var net = { on:false, tried:false, channel:null,
                  id:"v" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36) };
      function myPresence(){
        return { name: me.name, species: me.species, coat: me.coat, room: me.room,
                 x: Math.round(me.x), y: Math.round(me.y), action: me.action || "" };
      }
      function netTrack(){
        if(net.on && net.channel){ try{ net.channel.track(myPresence()); }catch(e){} }
      }
      function netSend(payload){
        if(!net.on || !net.channel) return;
        try{
          payload.from = net.id;
          net.channel.send({ type:"broadcast", event:"act", payload: payload });
        }catch(e){}
      }
      function netSpeak(text){ netSend({ kind:"speak", text:text }); }
      function netAction(label, anim){
        netSend({ kind:"action", label:label, anim:anim,
                  x: Math.round(me.tx != null ? me.tx : me.x),
                  y: Math.round(me.ty != null ? me.ty : me.y) });
        netTrack();
      }
      function netRoomChanged(){
        netSend({ kind:"room", room: me.room });
        netTrack();
      }
      function remoteById(id){
        for(var i = 0; i < remotes.length; i++) if(remotes[i].id === id) return remotes[i];
        return null;
      }
      function syncRemotes(){
        if(!net.channel) return;
        var state;
        try{ state = net.channel.presenceState(); }catch(e){ return; }
        var seen = {};
        Object.keys(state).forEach(function(key){
          if(key === net.id) return;
          var meta = state[key] && state[key][0];
          if(!meta || !meta.name) return;
          seen[key] = true;
          var r = remoteById(key);
          if(!r){
            r = { id:key, name:String(meta.name).slice(0, 12),
                  species: meta.species === "dog" ? "dog" : "cat",
                  coat: meta.coat || "orange", pattern:"plain",
                  room: ROOMS[meta.room] ? meta.room : "classroom",
                  action: meta.action || "刚入学", state:"idle",
                  x: +meta.x || 50, y: +meta.y || 76, tx: +meta.x || 50, ty: +meta.y || 76,
                  dir:1, bubbleTimer:null, isMe:false, isRemote:true };
            remotes.push(r);
            renderPet(r);
            feed("<b>" + escapeHtml(r.name) + "</b> 也来上学啦，是一位真人同学");
          } else {
            r.action = meta.action || r.action;
            if(meta.room && ROOMS[meta.room] && r.room !== meta.room){
              r.room = meta.room;
              r.x = +meta.x || 50; r.y = +meta.y || 76;
              placePet(r);
            } else if(typeof meta.x === "number" && (Math.abs(meta.x - r.x) > 4 || Math.abs(meta.y - r.y) > 4)){
              movePet(r, meta.x, meta.y);
            }
          }
        });
        for(var i = remotes.length - 1; i >= 0; i--){
          if(!seen[remotes[i].id]){
            feed("<b>" + escapeHtml(remotes[i].name) + "</b> 放学回家啦（真人同学）");
            removePet(remotes[i]);
            remotes.splice(i, 1);
          }
        }
        updateCounts(); renderRoster();
      }
      function onRemoteAct(p){
        if(!p || p.from === net.id) return;
        var r = remoteById(p.from);
        if(!r) return;
        if(p.kind === "speak"){
          showBubble(r, String(p.text || (r.species === "cat" ? "喵~" : "汪汪！")).slice(0, 24), 2600, true);
        } else if(p.kind === "action"){
          if(p.label) r.action = String(p.label).slice(0, 12);
          if(p.anim) playAnim(r, String(p.anim), 3200);
          if(typeof p.x === "number" && typeof p.y === "number") movePet(r, p.x, p.y);
          renderRoster();
        }
      }
      function initRealtime(){
        if(net.tried) return;
        net.tried = true;
        try{
          if(!window.supabase || !window.supabase.createClient) return;
          var sb = window.supabase.createClient(
            "https://boiomdlavmuigafnuufm.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJvaW9tZGxhdm11aWdhZm51dWZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2MDExNTYsImV4cCI6MjExMTE3NzE1Nn0.ceZKbpWRgVIFf1_kK-6EiF5A51DoWuU7FEq12up6qo0",
            { realtime: { params: { eventsPerSecond: 10 } } }
          );
          var ch = sb.channel("pet-school", { config: { presence: { key: net.id }, broadcast: { self:false } } });
          net.channel = ch;
          ch.on("presence", { event: "sync" }, syncRemotes);
          ch.on("broadcast", { event: "act" }, function(msg){ onRemoteAct(msg && msg.payload); });
          ch.subscribe(function(status){
            if(status === "SUBSCRIBED"){ net.on = true; netTrack(); syncRemotes(); }
            else if(status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED"){ net.on = false; }
          });
          /* 真人同学在我这边也轻轻走动，看起来更热闹 */
          setInterval(function(){
            remotes.forEach(function(r){
              if(!r.moving && Math.random() < .35){
                movePet(r, Math.min(90, Math.max(10, r.x + rand(-13, 13))),
                           Math.min(90, Math.max(58, r.y + rand(-6, 6))));
              }
            });
          }, 6000);
        }catch(e){
          net.on = false; net.channel = null;
        }
      }

      /* ---------------- 入学 ---------------- */
      function enterSchool(){
        entered = true;
        document.getElementById("entry").style.display = "none";
        document.getElementById("app").classList.add("on");
        $("#meName").textContent = me.name;
        $("#meSub").textContent = "一年级 · " + (me.species === "cat" ? "小猫班" : "小狗班");
        $("#meMini").innerHTML = petSVG(me.species, coatById(me.coat), me.pattern, "idle");
        gainTreat(0);
        classmates.forEach(renderPet);
        me.room = "classroom"; me.x = 50; me.y = 76;
        renderPet(me);
        switchRoom("classroom");
        renderSchedule(); updateCounts(); renderRoster();
        feed("<b>" + me.name + "</b> 入学啦，是一只" + (me.species === "cat" ? "小猫" : "小狗") + "同学");
        var greeter = pick(classmates);
        feed("<b>" + greeter.name + "</b> 在" + ROOMS[greeter.room].name + "跟你挥了挥爪");
        setTimeout(function(){
          showBubble(me, me.species === "cat" ? "喵~ 大家好！" : "汪汪！大家好！", 3000, true);
          if(me.species === "cat") playMeow(); else playBark();
        }, 600);
        initRealtime();
        setInterval(mateAct, 2600);
        setInterval(mateArriveLeave, 24000);
        setInterval(function(){ if(currentRoom === "playground") placeBall(); }, 7000);
        setInterval(renderSchedule, 60000);
        window.scrollTo(0,0);
      }
    })();
    </script>
